<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musk Engineering Ltd | Preview</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600&display=swap" rel="stylesheet">
<style>/* ============================================
   Musk Engineering Ltd - Main Stylesheet
   ============================================ */

/* --- Reset & Base --- */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary-teal: rgb(15, 132, 120);
    --accent-teal: rgb(78, 193, 180);
    --gradient-start: rgb(38, 162, 142);
    --gradient-end: rgb(13, 125, 130);
    --white: #ffffff;
    --dark-text: #0d141a;
    --gray-text: rgb(86, 88, 94);
    --black: rgb(0, 0, 0);
    --transition: 0.2s ease;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Roboto', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    font-size: 16px;
    line-height: 1.7;
    font-weight: 400;
    color: var(--dark-text);
    background: var(--white);
    -webkit-font-smoothing: antialiased;
}

img {
    max-width: 100%;
    height: auto;
}

a {
    color: var(--primary-teal);
    text-decoration: none;
    transition: color var(--transition);
}

a:hover {
    color: var(--accent-teal);
}

h1, h2, h3, h4, h5, h6 {
    font-weight: 600;
    line-height: 1.3;
    color: var(--dark-text);
}

/* --- Container --- */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
}

/* --- Utility --- */
.text-center { text-align: center; }
.mt-2 { margin-top: 2rem; }

/* --- Buttons --- */
.btn {
    display: inline-block;
    font-family: 'Roboto', sans-serif;
    font-size: 0.95rem;
    font-weight: 500;
    cursor: pointer;
    transition: all var(--transition);
    border: 2px solid transparent;
    text-align: center;
    letter-spacing: 0.025em;
    text-decoration: none;
}

.btn-black {
    background: var(--black);
    color: var(--white);
    border-radius: 999px;
    padding: 16px 40px;
    border-color: var(--black);
}

.btn-black:hover {
    background: #333;
    color: var(--white);
    border-color: #333;
}

.btn-hero-outline {
    background: transparent;
    color: var(--white);
    border: 2px solid var(--white);
    border-radius: 28px;
    padding: 14px 36px;
    font-size: 1rem;
    font-weight: 500;
}

.btn-hero-outline:hover {
    background: var(--accent-teal);
    color: var(--black);
    border-color: var(--accent-teal);
}

.btn-outline-teal {
    background: var(--white);
    color: var(--primary-teal);
    border: 2px solid var(--primary-teal);
    border-radius: 28px;
    padding: 12px 32px;
    font-weight: 500;
}

.btn-outline-teal:hover {
    background: var(--primary-teal);
    color: var(--white);
}

.btn-primary {
    background: var(--black);
    color: var(--white);
    border-radius: 999px;
    padding: 16px 40px;
    border-color: var(--black);
}

.btn-primary:hover {
    background: #333;
    color: var(--white);
    border-color: #333;
}

.btn-full {
    width: 100%;
}

/* ============================================
   HEADER
   ============================================ */
.site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: var(--white);
    box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    transition: box-shadow 0.3s ease;
}

.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 80px;
}

.logo {
    display: flex;
    align-items: center;
    text-decoration: none;
    flex-shrink: 0;
}

.logo-img {
    height: 55px;
    width: auto;
}

.main-nav {
    flex: 1;
    display: flex;
    justify-content: center;
}

.main-nav ul {
    display: flex;
    list-style: none;
    gap: 4px;
}

.main-nav a {
    display: block;
    padding: 10px 20px;
    color: var(--dark-text);
    font-size: 0.95rem;
    font-weight: 500;
    border-radius: 6px;
    transition: all var(--transition);
}

.main-nav a:hover {
    color: var(--primary-teal);
}

.main-nav a.active {
    color: var(--primary-teal);
    font-weight: 600;
}

.header-right {
    display: flex;
    align-items: center;
    gap: 16px;
}

.header-linkedin {
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--dark-text);
    transition: color var(--transition);
}

.header-linkedin:hover {
    color: var(--primary-teal);
}

/* Mobile Toggle */
.mobile-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
}

.mobile-toggle span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--dark-text);
    border-radius: 2px;
    transition: all 0.3s ease;
}

.mobile-toggle.active span:nth-child(1) {
    transform: rotate(45deg) translate(5px, 5px);
}

.mobile-toggle.active span:nth-child(2) {
    opacity: 0;
}

.mobile-toggle.active span:nth-child(3) {
    transform: rotate(-45deg) translate(5px, -5px);
}

/* ============================================
   HERO SECTION
   ============================================ */
.hero {
    position: relative;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    overflow: hidden;
}

.hero-bg {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background-image: url('https://images.unsplash.com/photo-1508437239324-d3cba279d4d0?auto=format&fit=crop&w=1920');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    filter: grayscale(100%);
}

.hero-overlay {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.55);
}

.hero .container {
    position: relative;
    z-index: 2;
}

.hero-content {
    max-width: 900px;
    margin: 0 auto;
    padding-top: 80px;
}

.hero-content h1 {
    font-size: 64px;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 1.5rem;
    line-height: 1.15;
}

.hero-subtitle {
    font-size: 32px;
    color: var(--white);
    margin-bottom: 2.5rem;
    line-height: 1.4;
    font-weight: 400;
}

.hero-buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
    justify-content: center;
}

/* ============================================
   PAGE HERO (inner pages)
   ============================================ */
.page-hero {
    padding: 160px 0 80px;
    background: linear-gradient(160deg, var(--gradient-start), var(--gradient-end));
    color: var(--white);
}

.page-hero h1 {
    color: var(--white);
    margin-bottom: 1rem;
    font-size: 2.5rem;
}

.page-hero p {
    color: rgba(255,255,255,0.85);
    font-size: 1.15rem;
    max-width: 600px;
}

/* ============================================
   WHO WE ARE SECTION
   ============================================ */
.who-we-are {
    padding: 80px 0;
    background: var(--white);
}

.who-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
    margin-bottom: 80px;
}

.who-text h3 {
    font-size: 48px;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--dark-text);
}

.who-accent {
    font-size: 18px;
    font-weight: 600;
    color: var(--accent-teal);
    margin-bottom: 1.5rem;
}

.who-body {
    color: var(--gray-text);
    margin-bottom: 1rem;
    font-size: 1rem;
    line-height: 1.8;
}

.who-img-main {
    width: 100%;
    border-radius: 20px;
    display: block;
}

/* What We Do sub-section */
.what-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
}

.what-images {
    position: relative;
}

.what-img-person {
    width: 65%;
    border-radius: 20px;
    display: block;
}

.what-img-overlap {
    position: absolute;
    bottom: -30px;
    right: 0;
    width: 45%;
    border-radius: 20px;
    box-shadow: 0 8px 30px rgba(0,0,0,0.15);
}

.what-text h3 {
    font-size: 48px;
    font-weight: 600;
    margin-bottom: 1rem;
    color: var(--dark-text);
}

.what-body {
    color: var(--gray-text);
    margin-bottom: 1rem;
    font-size: 1rem;
    line-height: 1.8;
}

.teal-highlight {
    color: var(--accent-teal);
    font-weight: 500;
}

.teal-highlight strong {
    font-weight: 700;
}

/* ============================================
   BUILT FOR INDUSTRY LEADERS
   ============================================ */
.industry-leaders {
    padding: 80px 0;
    background: var(--primary-teal);
}

.industry-header {
    text-align: center;
    margin-bottom: 3rem;
}

.industry-header h3 {
    font-size: 2.5rem;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 1rem;
}

.industry-header p {
    color: rgba(255,255,255,0.85);
    font-size: 1.1rem;
    max-width: 700px;
    margin: 0 auto;
}

.industry-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 32px;
}

.industry-cell {
    position: relative;
    padding-bottom: 60px;
}

.industry-img {
    width: 100%;
    border-radius: 20px;
    display: block;
    height: 300px;
    object-fit: cover;
}

.industry-label-card {
    position: absolute;
    bottom: 0;
    left: 50%;
    transform: translateX(-50%);
    background: var(--white);
    border-radius: 0;
    padding: 24px 20px;
    text-align: center;
    width: 70%;
    font-size: 1rem;
    color: var(--dark-text);
    line-height: 1.4;
}

/* ============================================
   LINKEDIN SECTION
   ============================================ */
.linkedin-section {
    padding: 80px 0;
    background: linear-gradient(160deg, var(--gradient-start), var(--gradient-end));
}

.linkedin-embed {
    max-width: 800px;
    margin: 0 auto;
    text-align: center;
}

/* ============================================
   ABOUT PAGE
   ============================================ */
.about-intro {
    padding: 80px 0;
}

.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
}

.about-text h2 {
    margin-bottom: 1.5rem;
}

.about-text p {
    color: var(--gray-text);
    margin-bottom: 1rem;
    line-height: 1.8;
}

.about-image img {
    width: 100%;
    border-radius: 20px;
}

/* --- Values --- */
.values-section {
    padding: 80px 0;
    background: #f7f8fa;
}

.values-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
}

.value-card {
    background: var(--white);
    border-radius: 12px;
    padding: 40px 28px;
    border: 1px solid #e2e8f0;
    transition: all 0.3s ease;
}

.value-card:hover {
    transform: translateY(-4px);
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
}

.value-number {
    font-size: 2.5rem;
    font-weight: 600;
    color: var(--accent-teal);
    line-height: 1;
    margin-bottom: 1rem;
    opacity: 0.6;
}

.value-card h3 {
    margin-bottom: 0.75rem;
}

.value-card p {
    color: var(--gray-text);
    font-size: 0.95rem;
}

/* --- Experience --- */
.experience-section {
    padding: 80px 0;
}

.experience-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
}

.experience-content h2 {
    margin-bottom: 1.5rem;
}

.experience-content p {
    color: var(--gray-text);
    margin-bottom: 1.5rem;
}

.check-list {
    list-style: none;
    margin-top: 1rem;
}

.check-list li {
    padding: 8px 0 8px 32px;
    position: relative;
    color: var(--dark-text);
}

.check-list li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 14px;
    width: 18px;
    height: 18px;
    background: var(--accent-teal);
    border-radius: 50%;
    opacity: 0.2;
}

.check-list li::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 19px;
    width: 8px;
    height: 4px;
    border-left: 2px solid var(--primary-teal);
    border-bottom: 2px solid var(--primary-teal);
    transform: rotate(-45deg);
}

.experience-stats {
    display: flex;
    flex-direction: column;
    gap: 24px;
}

.stat-block {
    background: #f7f8fa;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    transition: all 0.3s ease;
}

.stat-block:hover {
    border-color: var(--accent-teal);
    box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
}

.stat-block .stat-number {
    font-size: 3rem;
    min-width: 90px;
    font-weight: 600;
    color: var(--primary-teal);
    line-height: 1;
}

.stat-block .stat-text {
    font-size: 1rem;
    color: var(--gray-text);
    font-weight: 500;
}

/* --- Section Label --- */
.section-label {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent-teal);
    margin-bottom: 0.75rem;
}

.section-header {
    text-align: center;
    max-width: 700px;
    margin: 0 auto 3.5rem;
}

.section-header p {
    color: var(--gray-text);
    font-size: 1.1rem;
    margin-top: 1rem;
}

/* ============================================
   SERVICES PAGE
   ============================================ */
.service-detail {
    padding: 80px 0;
}

.service-detail.alt {
    background: #f7f8fa;
}

.service-detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
}

.service-detail-grid.reverse {
    direction: rtl;
}

.service-detail-grid.reverse > * {
    direction: ltr;
}

.service-detail-content h2 {
    margin-bottom: 1rem;
}

.service-detail-content p {
    color: var(--gray-text);
    margin-bottom: 1.5rem;
    line-height: 1.8;
}

.service-detail-image img {
    width: 100%;
    border-radius: 20px;
}

.service-detail-image .image-placeholder {
    background: linear-gradient(135deg, #f7f8fa 0%, #e2e8f0 100%);
    border-radius: 20px;
    min-height: 350px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-teal);
}

.service-detail-image .image-placeholder.large {
    min-height: 350px;
}

/* --- Process --- */
.process-section {
    padding: 80px 0;
    background: #f7f8fa;
}

.process-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
}

.process-step {
    text-align: center;
    position: relative;
}

.process-number {
    width: 56px;
    height: 56px;
    background: var(--primary-teal);
    color: var(--white);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: 600;
    margin: 0 auto 1.5rem;
}

.process-step h3 {
    margin-bottom: 0.75rem;
}

.process-step p {
    color: var(--gray-text);
    font-size: 0.95rem;
}

/* ============================================
   CTA SECTION
   ============================================ */
.cta-section {
    padding: 80px 0;
    background: linear-gradient(160deg, var(--gradient-start), var(--gradient-end));
}

.cta-content {
    text-align: center;
    max-width: 600px;
    margin: 0 auto;
}

.cta-content h2 {
    color: var(--white);
    margin-bottom: 1rem;
}

.cta-content p {
    color: rgba(255,255,255,0.85);
    margin-bottom: 2rem;
    font-size: 1.1rem;
}

/* ============================================
   PROJECTS PAGE
   ============================================ */
.projects-detail {
    padding: 80px 0;
}

.projects-detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 32px;
}

.project-detail-card {
    background: #f7f8fa;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 40px;
    transition: all 0.3s ease;
}

.project-detail-card:hover {
    border-color: var(--accent-teal);
    box-shadow: 0 20px 25px -5px rgba(0,0,0,0.1);
    transform: translateY(-4px);
}

.project-detail-icon {
    color: var(--primary-teal);
    margin-bottom: 1.5rem;
}

.project-detail-card h3 {
    margin-bottom: 1rem;
}

.project-detail-card p {
    color: var(--gray-text);
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
}

/* ============================================
   CONTACT PAGE
   ============================================ */
.contact-section {
    padding: 80px 0;
}

.contact-grid {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 60px;
}

.contact-info h2 {
    margin-bottom: 1rem;
}

.contact-info > p {
    color: var(--gray-text);
    margin-bottom: 2rem;
}

.contact-item {
    display: flex;
    gap: 16px;
    margin-bottom: 2rem;
}

.contact-icon {
    width: 48px;
    height: 48px;
    background: #f7f8fa;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-teal);
    flex-shrink: 0;
}

.contact-item h4 {
    margin-bottom: 0.25rem;
}

.contact-item p {
    color: var(--gray-text);
    font-size: 0.95rem;
}

.contact-social {
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid #e2e8f0;
}

.contact-social h4 {
    margin-bottom: 1rem;
}

.social-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: var(--primary-teal);
    color: var(--white);
    border-radius: 8px;
    transition: all var(--transition);
}

.social-link:hover {
    background: var(--accent-teal);
    color: var(--dark-text);
    transform: translateY(-2px);
}

/* --- Contact Form --- */
.contact-form-wrapper {
    background: #f7f8fa;
    border: 1px solid #e2e8f0;
    border-radius: 12px;
    padding: 40px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 20px;
}

.form-row .form-group {
    margin-bottom: 0;
}

.form-group label {
    display: block;
    font-size: 0.9rem;
    font-weight: 500;
    color: var(--dark-text);
    margin-bottom: 0.5rem;
}

.required {
    color: #e53e3e;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid #e2e8f0;
    border-radius: 8px;
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--dark-text);
    background: var(--white);
    transition: border-color var(--transition), box-shadow var(--transition);
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--primary-teal);
    box-shadow: 0 0 0 3px rgba(15, 132, 120, 0.1);
}

.form-group textarea {
    resize: vertical;
    min-height: 120px;
}

.form-success {
    text-align: center;
    padding: 60px 40px;
    color: var(--primary-teal);
}

.form-success svg {
    color: #38a169;
    margin-bottom: 1.5rem;
}

.form-success h3 {
    margin-bottom: 0.75rem;
    color: #38a169;
}

.form-success p {
    color: var(--gray-text);
}

.form-error {
    background: #fed7d7;
    color: #c53030;
    padding: 16px 20px;
    border-radius: 8px;
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
}

/* ============================================
   FOOTER
   ============================================ */
.site-footer {
    background: var(--primary-teal);
    color: var(--white);
    padding: 60px 0 0;
}

.footer-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr;
    gap: 60px;
    padding-bottom: 40px;
}

.footer-col-left {
    display: flex;
    flex-direction: column;
}

.footer-linkedin {
    display: inline-flex;
    color: var(--white);
    margin-bottom: 1rem;
    transition: opacity var(--transition);
}

.footer-linkedin:hover {
    opacity: 0.8;
    color: var(--white);
}

.footer-title {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--white);
    margin-bottom: 0.75rem;
}

.footer-desc {
    font-size: 14px;
    color: var(--white);
    line-height: 1.7;
    opacity: 0.85;
    margin-bottom: 1.5rem;
}

.footer-musk-logo {
    max-width: 180px;
    margin-top: 0.5rem;
}

.footer-col-right {
    text-align: right;
}

}
