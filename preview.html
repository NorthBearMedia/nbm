<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Musk Engineering Ltd | Preview</title>
<style>
/* ============================================
   Musk Engineering Ltd - Main Stylesheet
   ============================================ */

/* --- Reset & Base --- */
*, *::before, *::after {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #1a3a5c;
    --primary-dark: #0f2640;
    --primary-light: #2a5a8c;
    --accent: #d4a843;
    --accent-hover: #c49a35;
    --text: #2d3748;
    --text-light: #718096;
    --text-white: #ffffff;
    --bg: #ffffff;
    --bg-light: #f7f8fa;
    --bg-dark: #0f2640;
    --border: #e2e8f0;
    --shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
    --shadow-lg: 0 20px 25px -5px rgba(0,0,0,0.1), 0 10px 10px -5px rgba(0,0,0,0.04);
    --radius: 8px;
    --radius-lg: 12px;
    --transition: 0.3s ease;
}

html {
    scroll-behavior: smooth;
}

body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    font-size: 16px;
    line-height: 1.7;
    color: var(--text);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
}

img {
    max-width: 100%;
    height: auto;
}

a {
    color: var(--primary);
    text-decoration: none;
    transition: color var(--transition);
}

a:hover {
    color: var(--accent);
}

h1, h2, h3, h4, h5, h6 {
    font-weight: 700;
    line-height: 1.3;
    color: var(--primary-dark);
}

h1 { font-size: 3rem; }
h2 { font-size: 2.25rem; }
h3 { font-size: 1.5rem; }
h4 { font-size: 1.125rem; }

/* --- Container --- */
.container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 0 24px;
}

/* --- Utility --- */
.text-center { text-align: center; }
.mt-2 { margin-top: 2rem; }

/* --- Buttons --- */
.btn {
    display: inline-block;
    padding: 14px 32px;
    font-size: 0.95rem;
    font-weight: 600;
    border-radius: var(--radius);
    cursor: pointer;
    transition: all var(--transition);
    border: 2px solid transparent;
    text-align: center;
    letter-spacing: 0.025em;
}

.btn-primary {
    background: var(--accent);
    color: var(--primary-dark);
    border-color: var(--accent);
}

.btn-primary:hover {
    background: var(--accent-hover);
    border-color: var(--accent-hover);
    color: var(--primary-dark);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}

.btn-secondary {
    background: var(--primary);
    color: var(--text-white);
    border-color: var(--primary);
}

.btn-secondary:hover {
    background: var(--primary-dark);
    border-color: var(--primary-dark);
    color: var(--text-white);
    transform: translateY(-2px);
    box-shadow: var(--shadow);
}

.btn-outline {
    background: transparent;
    color: var(--text-white);
    border-color: var(--text-white);
}

.btn-outline:hover {
    background: var(--text-white);
    color: var(--primary-dark);
    transform: translateY(-2px);
}

.btn-full {
    width: 100%;
}

/* ============================================
   HEADER
   ============================================ */
.site-header {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 1000;
    background: rgba(15, 38, 64, 0.95);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.1);
}

.header-inner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    height: 80px;
}

.logo {
    display: flex;
    flex-direction: column;
    text-decoration: none;
}

.logo-text {
    font-size: 1.75rem;
    font-weight: 800;
    color: var(--text-white);
    letter-spacing: 0.15em;
    line-height: 1;
}

.logo-sub {
    font-size: 0.65rem;
    font-weight: 500;
    color: var(--accent);
    letter-spacing: 0.3em;
    text-transform: uppercase;
}

.main-nav ul {
    display: flex;
    list-style: none;
    gap: 8px;
}

.main-nav a {
    display: block;
    padding: 10px 20px;
    color: rgba(255,255,255,0.85);
    font-size: 0.9rem;
    font-weight: 500;
    border-radius: var(--radius);
    transition: all var(--transition);
}

.main-nav a:hover,
.main-nav a.active {
    color: var(--text-white);
    background: rgba(255,255,255,0.1);
}

.main-nav a.active {
    color: var(--accent);
}

/* Mobile Toggle */
.mobile-toggle {
    display: none;
    flex-direction: column;
    gap: 5px;
    background: none;
    border: none;
    cursor: pointer;
    padding: 8px;
}

.mobile-toggle span {
    display: block;
    width: 24px;
    height: 2px;
    background: var(--text-white);
    border-radius: 2px;
    transition: all var(--transition);
}

/* ============================================
   HERO SECTION
   ============================================ */
.hero {
    position: relative;
    min-height: 90vh;
    display: flex;
    align-items: center;
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 50%, var(--primary-light) 100%);
    overflow: hidden;
}

.hero::before {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background:
        radial-gradient(ellipse at 20% 50%, rgba(212,168,67,0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 20%, rgba(42,90,140,0.3) 0%, transparent 50%);
}

.hero-content {
    position: relative;
    max-width: 700px;
    padding-top: 80px;
}

.hero-content h1 {
    font-size: 3.5rem;
    font-weight: 800;
    color: var(--text-white);
    margin-bottom: 1.5rem;
    line-height: 1.15;
}

.hero-content p {
    font-size: 1.2rem;
    color: rgba(255,255,255,0.8);
    margin-bottom: 2.5rem;
    line-height: 1.8;
}

.hero-buttons {
    display: flex;
    gap: 16px;
    flex-wrap: wrap;
}

/* ============================================
   PAGE HERO (inner pages)
   ============================================ */
.page-hero {
    padding: 160px 0 80px;
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
    color: var(--text-white);
}

.page-hero h1 {
    color: var(--text-white);
    margin-bottom: 1rem;
}

.page-hero p {
    color: rgba(255,255,255,0.8);
    font-size: 1.15rem;
    max-width: 600px;
}

/* ============================================
   SECTION LABEL
   ============================================ */
.section-label {
    display: inline-block;
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--accent);
    margin-bottom: 0.75rem;
}

.section-header {
    text-align: center;
    max-width: 700px;
    margin: 0 auto 3.5rem;
}

.section-header p {
    color: var(--text-light);
    font-size: 1.1rem;
    margin-top: 1rem;
}

/* ============================================
   INTRO SECTION
   ============================================ */
.intro-section {
    padding: 100px 0;
}

.intro-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
}

.intro-text h2 {
    margin-bottom: 1.5rem;
}

.intro-text p {
    color: var(--text-light);
    margin-bottom: 1rem;
}

.intro-text .btn {
    margin-top: 1rem;
}

.intro-stats {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 24px;
}

.stat-card {
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 24px;
    text-align: center;
    transition: all var(--transition);
}

.stat-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent);
}

.stat-number {
    display: block;
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--primary);
    line-height: 1;
    margin-bottom: 0.5rem;
}

.stat-label {
    font-size: 0.85rem;
    color: var(--text-light);
    font-weight: 500;
}

/* ============================================
   SERVICES OVERVIEW
   ============================================ */
.services-overview {
    padding: 100px 0;
    background: var(--bg-light);
}

.services-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 32px;
}

.service-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px 32px;
    transition: all var(--transition);
}

.service-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-lg);
    border-color: var(--accent);
}

.service-icon {
    width: 72px;
    height: 72px;
    background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
    border-radius: var(--radius-lg);
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    color: var(--text-white);
}

.service-card h3 {
    margin-bottom: 1rem;
    font-size: 1.25rem;
}

.service-card p {
    color: var(--text-light);
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
}

.service-link {
    font-weight: 600;
    font-size: 0.9rem;
    color: var(--primary);
    transition: all var(--transition);
}

.service-link:hover {
    color: var(--accent);
}

/* ============================================
   SECTORS PREVIEW
   ============================================ */
.sectors-preview {
    padding: 100px 0;
}

.sectors-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 24px;
}

.sector-card {
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px 24px;
    text-align: center;
    transition: all var(--transition);
}

.sector-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow);
    border-color: var(--accent);
}

.sector-icon {
    color: var(--primary);
    margin-bottom: 1rem;
}

.sector-card h4 {
    color: var(--primary-dark);
    font-weight: 600;
}

/* ============================================
   CTA SECTION
   ============================================ */
.cta-section {
    padding: 80px 0;
    background: linear-gradient(135deg, var(--primary-dark) 0%, var(--primary) 100%);
}

.cta-content {
    text-align: center;
    max-width: 600px;
    margin: 0 auto;
}

.cta-content h2 {
    color: var(--text-white);
    margin-bottom: 1rem;
}

.cta-content p {
    color: rgba(255,255,255,0.8);
    margin-bottom: 2rem;
    font-size: 1.1rem;
}

/* ============================================
   ABOUT PAGE
   ============================================ */
.about-intro {
    padding: 100px 0;
}

.about-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
}

.about-text h2 {
    margin-bottom: 1.5rem;
}

.about-text p {
    color: var(--text-light);
    margin-bottom: 1rem;
}

.about-image .image-placeholder {
    background: linear-gradient(135deg, var(--bg-light) 0%, #e2e8f0 100%);
    border-radius: var(--radius-lg);
    min-height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-light);
}

/* --- Values --- */
.values-section {
    padding: 100px 0;
    background: var(--bg-light);
}

.values-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
}

.value-card {
    background: var(--bg);
    border-radius: var(--radius-lg);
    padding: 40px 28px;
    border: 1px solid var(--border);
    transition: all var(--transition);
}

.value-card:hover {
    transform: translateY(-4px);
    box-shadow: var(--shadow-lg);
}

.value-number {
    font-size: 2.5rem;
    font-weight: 800;
    color: var(--accent);
    line-height: 1;
    margin-bottom: 1rem;
    opacity: 0.6;
}

.value-card h3 {
    margin-bottom: 0.75rem;
}

.value-card p {
    color: var(--text-light);
    font-size: 0.95rem;
}

/* --- Experience --- */
.experience-section {
    padding: 100px 0;
}

.experience-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
}

.experience-content h2 {
    margin-bottom: 1.5rem;
}

.experience-content p {
    color: var(--text-light);
    margin-bottom: 1.5rem;
}

.check-list {
    list-style: none;
    margin-top: 1rem;
}

.check-list li {
    padding: 8px 0 8px 32px;
    position: relative;
    color: var(--text);
}

.check-list li::before {
    content: '';
    position: absolute;
    left: 0;
    top: 14px;
    width: 18px;
    height: 18px;
    background: var(--accent);
    border-radius: 50%;
    opacity: 0.2;
}

.check-list li::after {
    content: '';
    position: absolute;
    left: 5px;
    top: 19px;
    width: 8px;
    height: 4px;
    border-left: 2px solid var(--accent);
    border-bottom: 2px solid var(--accent);
    transform: rotate(-45deg);
}

.experience-stats {
    display: flex;
    flex-direction: column;
    gap: 24px;
}

.stat-block {
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 32px;
    display: flex;
    align-items: center;
    gap: 24px;
    transition: all var(--transition);
}

.stat-block:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow);
}

.stat-block .stat-number {
    font-size: 3rem;
    min-width: 90px;
}

.stat-block .stat-text {
    font-size: 1rem;
    color: var(--text-light);
    font-weight: 500;
}

/* ============================================
   SERVICES PAGE
   ============================================ */
.service-detail {
    padding: 80px 0;
}

.service-detail.alt {
    background: var(--bg-light);
}

.service-detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 60px;
    align-items: center;
}

.service-detail-grid.reverse {
    direction: rtl;
}

.service-detail-grid.reverse > * {
    direction: ltr;
}

.service-detail-content h2 {
    margin-bottom: 1rem;
}

.service-detail-content p {
    color: var(--text-light);
    margin-bottom: 1.5rem;
}

.service-detail-image .image-placeholder {
    background: linear-gradient(135deg, var(--bg-light) 0%, #e2e8f0 100%);
    border-radius: var(--radius-lg);
    min-height: 350px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary-light);
}

.service-detail-image .image-placeholder.large {
    min-height: 350px;
}

/* --- Process --- */
.process-section {
    padding: 100px 0;
    background: var(--bg-light);
}

.process-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 32px;
}

.process-step {
    text-align: center;
    position: relative;
}

.process-number {
    width: 56px;
    height: 56px;
    background: var(--primary);
    color: var(--text-white);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.25rem;
    font-weight: 700;
    margin: 0 auto 1.5rem;
}

.process-step h3 {
    margin-bottom: 0.75rem;
}

.process-step p {
    color: var(--text-light);
    font-size: 0.95rem;
}

/* ============================================
   SECTORS PAGE
   ============================================ */
.sectors-detail {
    padding: 80px 0;
}

.sectors-detail-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 32px;
}

.sector-detail-card {
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px;
    transition: all var(--transition);
}

.sector-detail-card:hover {
    border-color: var(--accent);
    box-shadow: var(--shadow-lg);
    transform: translateY(-4px);
}

.sector-detail-icon {
    color: var(--primary);
    margin-bottom: 1.5rem;
}

.sector-detail-card h3 {
    margin-bottom: 1rem;
}

.sector-detail-card p {
    color: var(--text-light);
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
}

/* ============================================
   CONTACT PAGE
   ============================================ */
.contact-section {
    padding: 80px 0;
}

.contact-grid {
    display: grid;
    grid-template-columns: 1fr 1.5fr;
    gap: 60px;
}

.contact-info h2 {
    margin-bottom: 1rem;
}

.contact-info > p {
    color: var(--text-light);
    margin-bottom: 2rem;
}

.contact-item {
    display: flex;
    gap: 16px;
    margin-bottom: 2rem;
}

.contact-icon {
    width: 48px;
    height: 48px;
    background: var(--bg-light);
    border-radius: var(--radius);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--primary);
    flex-shrink: 0;
}

.contact-item h4 {
    margin-bottom: 0.25rem;
}

.contact-item p {
    color: var(--text-light);
    font-size: 0.95rem;
}

.contact-social {
    margin-top: 2rem;
    padding-top: 2rem;
    border-top: 1px solid var(--border);
}

.contact-social h4 {
    margin-bottom: 1rem;
}

.social-link {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    background: var(--primary);
    color: var(--text-white);
    border-radius: var(--radius);
    transition: all var(--transition);
}

.social-link:hover {
    background: var(--accent);
    color: var(--primary-dark);
    transform: translateY(-2px);
}

/* --- Contact Form --- */
.contact-form-wrapper {
    background: var(--bg-light);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 40px;
}

.form-row {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin-bottom: 20px;
}

.form-group {
    margin-bottom: 20px;
}

.form-row .form-group {
    margin-bottom: 0;
}

.form-group label {
    display: block;
    font-size: 0.9rem;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 0.5rem;
}

.required {
    color: #e53e3e;
}

.form-group input,
.form-group textarea {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: var(--radius);
    font-family: inherit;
    font-size: 0.95rem;
    color: var(--text);
    background: var(--bg);
    transition: border-color var(--transition), box-shadow var(--transition);
}

.form-group input:focus,
.form-group textarea:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(26, 58, 92, 0.1);
}

.form-group textarea {
    resize: vertical;
    min-height: 120px;
}

.form-success {
    text-align: center;
    padding: 60px 40px;
    color: var(--primary);
}

.form-success svg {
    color: #38a169;
    margin-bottom: 1.5rem;
}

.form-success h3 {
    margin-bottom: 0.75rem;
    color: #38a169;
}

.form-success p {
    color: var(--text-light);
}

.form-error {
    background: #fed7d7;
    color: #c53030;
    padding: 16px 20px;
    border-radius: var(--radius);
    margin-bottom: 1.5rem;
    font-size: 0.95rem;
}

/* ============================================
   FOOTER
   ============================================ */
.site-footer {
    background: var(--bg-dark);
    color: rgba(255,255,255,0.7);
    padding: 80px 0 0;
}

.footer-grid {
    display: grid;
    grid-template-columns: 1.5fr 1fr 1fr 1.5fr;
    gap: 40px;
    padding-bottom: 60px;
}

.footer-logo {
    display: flex;
    flex-direction: column;
    margin-bottom: 1rem;
}

.footer-logo .logo-text {
    font-size: 1.5rem;
}

.footer-col p {
    font-size: 0.9rem;
    line-height: 1.7;
}

.footer-col h4 {
    color: var(--text-white);
    font-size: 1rem;
    margin-bottom: 1.25rem;
    font-weight: 600;
}

.footer-col ul {
    list-style: none;
}

.footer-col ul li {
    margin-bottom: 0.5rem;
}

.footer-col ul a {
    color: rgba(255,255,255,0.6);
    font-size: 0.9rem;
    transition: color var(--transition);
}

.footer-col ul a:hover {
    color: var(--accent);
}

.contact-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    color: rgba(255,255,255,0.6);
    font-size: 0.9rem;
}

.contact-list li svg {
    flex-shrink: 0;
    opacity: 0.5;
}

.footer-bottom {
    border-top: 1px solid rgba(255,255,255,0.1);
    padding: 24px 0;
    text-align: center;
    font-size: 0.85rem;
}

/* ============================================
   RESPONSIVE
   ============================================ */
@media (max-width: 1024px) {
    h1 { font-size: 2.5rem; }
    h2 { font-size: 2rem; }

    .hero-content h1 { font-size: 2.75rem; }

    .services-grid,
    .sectors-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .values-grid,
    .process-grid {
        grid-template-columns: repeat(2, 1fr);
    }

    .footer-grid {

// Show home by default
var currentPage = "home";

function showPage(name) {
    currentPage = name;
    document.getElementById("app").innerHTML = pages[name];
    window.scrollTo(0, 0);
    
    // Re-bind navigation
    document.querySelectorAll("a").forEach(function(a) {
        var href = a.getAttribute("href");
        if (!href) return;
        var map = {"/": "home", "/about.php": "about", "/services.php": "services", "/sectors.php": "sectors", "/contact.php": "contact"};
        if (map[href]) {
            a.addEventListener("click", function(e) {
                e.preventDefault();
                showPage(map[href]);
            });
        }
        // Handle anchor links with page prefix
        Object.keys(map).forEach(function(prefix) {
            if (href.startsWith(prefix + "#") && prefix !== "/") {
                a.addEventListener("click", function(e) {
                    e.preventDefault();
                    showPage(map[prefix]);
                    setTimeout(function() {
                        var target = document.querySelector(href.substring(href.indexOf("#")));
                        if (target) target.scrollIntoView({behavior: "smooth"});
                    }, 100);
                });
            }
        });
    });

    // Mobile toggle
    var toggle = document.getElementById("mobileToggle");
    var nav = document.getElementById("mainNav");
    if (toggle && nav) {
        toggle.addEventListener("click", function() {
            nav.classList.toggle("active");
        });
    }

    // Scroll animations
    var els = document.querySelectorAll(".service-card, .stat-card, .sector-card, .value-card, .sector-detail-card, .process-step, .stat-block");
    if ("IntersectionObserver" in window) {
        var obs = new IntersectionObserver(function(entries) {
            entries.forEach(function(e) {
                if (e.isIntersecting) {
                    e.target.style.opacity = "1";
                    e.target.style.transform = "translateY(0)";
                    obs.unobserve(e.target);
                }
            });
        }, {threshold: 0.1});
        els.forEach(function(el) {
            el.style.opacity = "0";
            el.style.transform = "translateY(20px)";
            el.style.transition = "opacity 0.6s ease, transform 0.6s ease";
            obs.observe(el);
        });
    }
}
