services:
  - type: web
    name: nbm-project-management
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: ANTHROPIC_API_KEY
        sync: false
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
    rootDir: project-management
