<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Bear Console — Sign In</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Open Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #231f20;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(62, 175, 132, 0.1) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(62, 175, 132, 0.06) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    .login-container { width: 100%; max-width: 420px; padding: 0 20px; }

    .login-brand { text-align: center; margin-bottom: 40px; }

    .login-brand h1 {
      font-family: 'Montserrat', sans-serif;
      font-size: 24px;
      font-weight: 800;
      color: #3eaf84;
      margin-bottom: 4px;
    }

    .login-brand p { font-size: 13px; color: #7a7778; }

    .login-card {
      background: linear-gradient(170deg, rgba(45, 41, 42, 0.97), rgba(35, 31, 32, 0.98));
      border: 1px solid rgba(62, 175, 132, 0.15);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.5), 0 0 60px rgba(62, 175, 132, 0.06), inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(40px);
    }

    .form-group { margin-bottom: 24px; }
    .form-group label { display: block; font-size: 11px; font-weight: 600; color: #7a7778; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.8px; }
    .form-group input { width: 100%; background: rgba(30, 27, 28, 0.6); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 12px; padding: 14px 18px; font-size: 14px; color: #ffffff; outline: none; font-family: inherit; transition: all 0.25s ease; }
    .form-group input:focus { border-color: #3eaf84; box-shadow: 0 0 0 4px rgba(62, 175, 132, 0.12), 0 0 20px rgba(62, 175, 132, 0.06); background: rgba(35, 31, 32, 0.7); }
    .form-group input::placeholder { color: #5a5758; }

    .login-btn {
      width: 100%; padding: 14px; border: none; border-radius: 12px;
      background: linear-gradient(135deg, #3eaf84, #2d8a66);
      color: #fff; font-size: 14px; font-weight: 700; cursor: pointer;
      transition: all 0.25s ease; box-shadow: 0 4px 20px rgba(62, 175, 132, 0.35);
      font-family: 'Montserrat', sans-serif; letter-spacing: 0.3px;
    }
    .login-btn:hover { box-shadow: 0 8px 32px rgba(62, 175, 132, 0.5); transform: translateY(-2px); }
    .login-btn:active { transform: translateY(0); }

    .error-msg { display: none; background: rgba(248, 113, 113, 0.12); border: 1px solid rgba(248, 113, 113, 0.2); border-radius: 10px; padding: 12px 16px; font-size: 13px; color: #f87171; margin-bottom: 20px; text-align: center; }
    .error-msg.show { display: block; }

    .login-footer { text-align: center; margin-top: 24px; font-size: 12px; color: #5a5758; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-brand">
      <img src="/favicon.svg" alt="NB" style="width:56px;height:56px;border-radius:16px;box-shadow:0 8px 32px rgba(62,175,132,0.35);margin-bottom:16px">
      <h1>North Bear Console</h1>
      <p>Project Management</p>
    </div>
    <div class="login-card">
      <div class="error-msg" id="errorMsg"></div>
      <form id="loginForm">
        <div class="form-group"><label>Email</label><input type="email" id="loginEmail" placeholder="you@northbearmedia.co.uk" required autocomplete="email"></div>
        <div class="form-group"><label>Password</label><input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password"></div>
        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
    <div class="login-footer">&copy; 2026 North Bear Media. All rights reserved.</div>
  </div>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errorMsg');
      errEl.classList.remove('show');
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;
      try {
        const res = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ email, password }) });
        const data = await res.json();
        if (res.ok) { window.location.href = '/'; } else { errEl.textContent = data.error || 'Invalid credentials'; errEl.classList.add('show'); }
      } catch (err) { errEl.textContent = 'Connection error. Please try again.'; errEl.classList.add('show'); }
    });
  </script>
</body>
</html>
