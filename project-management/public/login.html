<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NorthBear Media — Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0c0d12;
      background-image:
        radial-gradient(ellipse at 30% 20%, rgba(139, 92, 246, 0.12) 0%, transparent 50%),
        radial-gradient(ellipse at 70% 80%, rgba(249, 112, 102, 0.08) 0%, transparent 50%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #f0f0f5;
      -webkit-font-smoothing: antialiased;
    }

    .login-container {
      width: 100%;
      max-width: 420px;
      padding: 0 20px;
    }

    .login-brand {
      text-align: center;
      margin-bottom: 40px;
    }

    .login-brand .logo-mark {
      width: 56px;
      height: 56px;
      background: linear-gradient(135deg, #8b5cf6, #f97066);
      border-radius: 16px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
      margin-bottom: 16px;
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.35);
    }

    .login-brand h1 {
      font-size: 24px;
      font-weight: 800;
      background: linear-gradient(135deg, #8b5cf6, #f97066);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 4px;
    }

    .login-brand p {
      font-size: 13px;
      color: #6b6f82;
    }

    .login-card {
      background: linear-gradient(170deg, rgba(28, 30, 44, 0.95), rgba(18, 19, 28, 0.97));
      border: 1px solid rgba(139, 92, 246, 0.15);
      border-radius: 24px;
      padding: 40px 36px;
      box-shadow:
        0 24px 80px rgba(0, 0, 0, 0.5),
        0 0 60px rgba(139, 92, 246, 0.06),
        inset 0 1px 0 rgba(255, 255, 255, 0.04);
      backdrop-filter: blur(40px);
    }

    .form-group {
      margin-bottom: 24px;
    }

    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: #6b6f82;
      margin-bottom: 10px;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    .form-group input {
      width: 100%;
      background: rgba(12, 13, 20, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 14px 18px;
      font-size: 14px;
      color: #f0f0f5;
      outline: none;
      font-family: inherit;
      transition: all 0.25s ease;
    }

    .form-group input:focus {
      border-color: #8b5cf6;
      box-shadow: 0 0 0 4px rgba(139, 92, 246, 0.12), 0 0 20px rgba(139, 92, 246, 0.06);
      background: rgba(15, 16, 24, 0.7);
    }

    .form-group input::placeholder {
      color: #4a4d5e;
    }

    .login-btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #8b5cf6, #f97066);
      color: #fff;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.25s ease;
      box-shadow: 0 4px 20px rgba(139, 92, 246, 0.35);
      font-family: inherit;
      letter-spacing: 0.3px;
    }

    .login-btn:hover {
      box-shadow: 0 8px 32px rgba(139, 92, 246, 0.5);
      transform: translateY(-2px);
    }

    .login-btn:active {
      transform: translateY(0);
    }

    .error-msg {
      display: none;
      background: rgba(248, 113, 113, 0.12);
      border: 1px solid rgba(248, 113, 113, 0.2);
      border-radius: 10px;
      padding: 12px 16px;
      font-size: 13px;
      color: #f87171;
      margin-bottom: 20px;
      text-align: center;
    }

    .error-msg.show {
      display: block;
    }

    .login-footer {
      text-align: center;
      margin-top: 24px;
      font-size: 12px;
      color: #4a4d5e;
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-brand">
      <div class="logo-mark">NBM</div>
      <h1>NorthBear Media</h1>
      <p>Project Management</p>
    </div>

    <div class="login-card">
      <div class="error-msg" id="errorMsg"></div>

      <form id="loginForm">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="loginEmail" placeholder="you@northbearmedia.co.uk" required autocomplete="email">
        </div>

        <div class="form-group">
          <label>Password</label>
          <input type="password" id="loginPassword" placeholder="Enter your password" required autocomplete="current-password">
        </div>

        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>

    <div class="login-footer">
      &copy; 2026 NorthBear Media. All rights reserved.
    </div>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const errEl = document.getElementById('errorMsg');
      errEl.classList.remove('show');

      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });
        const data = await res.json();
        if (res.ok) {
          window.location.href = '/';
        } else {
          errEl.textContent = data.error || 'Invalid credentials';
          errEl.classList.add('show');
        }
      } catch (err) {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.classList.add('show');
      }
    });
  </script>
</body>
</html>
