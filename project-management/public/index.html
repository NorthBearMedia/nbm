<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NorthBear Media — Project Management</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <div class="header-left">
      <div class="logo-mark">NBM</div>
      <div>
        <h1>NorthBear Media</h1>
        <p class="subtitle">Project Management</p>
      </div>
    </div>
    <div class="header-right">
      <div class="user-selector">
        <span>Logged in as:</span>
        <select id="currentUser">
          <option value="Norton">Norton</option>
        </select>
      </div>
      <div class="filter-group">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="recurring">Recurring</button>
        <button class="filter-btn" data-filter="ad-hoc">Ad Hoc</button>
      </div>
      <button class="btn btn-primary" id="addClientBtn">+ New Client</button>
      <button class="btn btn-ghost" id="manageTeamBtn">Team</button>
      <button class="btn btn-ghost" id="viewArchiveBtn">Archive</button>
    </div>
  </header>

  <!-- Main Content -->
  <main class="main">
    <!-- Stats Overview -->
    <div class="stats-bar" id="statsBar"></div>

    <div class="table-container">
      <div class="table-header">
        <div>Client</div>
        <div>Type</div>
        <div>Projects</div>
        <div>Outstanding</div>
        <div>Status</div>
        <div></div>
      </div>
      <div id="clientList" class="client-list">
        <div class="empty-state"><p>Loading...</p></div>
      </div>
    </div>
  </main>

  <!-- Modal Backdrop -->
  <div class="modal-backdrop" id="modalBackdrop"></div>

  <!-- Client Modal -->
  <div class="modal" id="clientModal">
    <div class="modal-header">
      <h2 id="clientModalTitle">New Client</h2>
      <button class="modal-close" onclick="closeModal('clientModal')">&times;</button>
    </div>
    <form id="clientForm">
      <input type="hidden" id="clientId">
      <div class="form-group">
        <label>Client Name</label>
        <input type="text" id="clientName" placeholder="e.g. Acme Corp" required>
      </div>
      <div class="form-group">
        <label>Agreement Type</label>
        <select id="clientType">
          <option value="recurring">Recurring</option>
          <option value="ad-hoc">Ad Hoc / One-off</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="clientNotes" rows="3" placeholder="Agreement details, contact info, etc."></textarea>
      </div>
      <div class="form-group">
        <label>Gmail Folder / Label Link</label>
        <input type="url" id="clientGmail" placeholder="https://mail.google.com/mail/u/0/#label/...">
      </div>
      <div class="form-group">
        <label>Google Drive Folder Link</label>
        <input type="url" id="clientDrive" placeholder="https://drive.google.com/drive/folders/...">
      </div>
      <div class="form-group">
        <label>Logo</label>
        <input type="file" id="clientLogo" accept="image/*">
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal('clientModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Client</button>
      </div>
    </form>
  </div>

  <!-- Project Modal -->
  <div class="modal" id="projectModal">
    <div class="modal-header">
      <h2 id="projectModalTitle">New Project</h2>
      <button class="modal-close" onclick="closeModal('projectModal')">&times;</button>
    </div>
    <form id="projectForm">
      <input type="hidden" id="projectId">
      <input type="hidden" id="projectClientId">
      <div class="form-group">
        <label>Project Name</label>
        <input type="text" id="projectName" placeholder="e.g. Website Redesign" required>
      </div>
      <div class="form-group">
        <label>Status</label>
        <select id="projectStatus">
          <option value="active">Active</option>
          <option value="on-hold">On Hold</option>
          <option value="completed">Completed</option>
        </select>
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="projectNotes" rows="3" placeholder="Project details..."></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal('projectModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Project</button>
      </div>
    </form>
  </div>

  <!-- Task Modal -->
  <div class="modal" id="taskModal">
    <div class="modal-header">
      <h2 id="taskModalTitle">New Task</h2>
      <button class="modal-close" onclick="closeModal('taskModal')">&times;</button>
    </div>
    <form id="taskForm">
      <input type="hidden" id="taskId">
      <input type="hidden" id="taskProjectId">
      <div class="form-group">
        <label>Task Title</label>
        <input type="text" id="taskTitle" placeholder="e.g. Design homepage mockup" required>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>Assigned To</label>
          <select id="taskAssignee">
            <option value="">Unassigned</option>
          </select>
        </div>
        <div class="form-group">
          <label>Deadline</label>
          <input type="date" id="taskDeadline">
        </div>
      </div>
      <div class="form-group">
        <label>Progress</label>
        <select id="taskProgress">
          <option value="not-started">Not Started</option>
          <option value="in-progress">In Progress</option>
          <option value="completed">Completed</option>
          <option value="blocked">Blocked</option>
        </select>
      </div>
      <div class="form-group">
        <label>References / Links</label>
        <input type="text" id="taskReferences" placeholder="URLs, file paths, etc.">
      </div>
      <div class="form-group">
        <label>Notes</label>
        <textarea id="taskNotes" rows="3" placeholder="Additional details..."></textarea>
      </div>
      <div class="form-actions">
        <button type="button" class="btn btn-ghost" onclick="closeModal('taskModal')">Cancel</button>
        <button type="submit" class="btn btn-primary">Save Task</button>
      </div>
    </form>
  </div>

  <!-- Team Modal -->
  <div class="modal" id="teamModal">
    <div class="modal-header">
      <h2>Team Members</h2>
      <button class="modal-close" onclick="closeModal('teamModal')">&times;</button>
    </div>
    <div id="teamList" class="team-list"></div>
    <form id="teamForm" class="team-form">
      <input type="text" id="teamMemberName" placeholder="Name" required>
      <input type="text" id="teamMemberRole" placeholder="Role">
      <input type="color" id="teamMemberColor" value="#6366f1">
      <button type="submit" class="btn btn-primary btn-sm">Add</button>
    </form>
  </div>

  <!-- History Modal -->
  <div class="modal" id="historyModal" style="max-width:620px">
    <div class="modal-header">
      <h2 id="historyModalTitle">Activity History</h2>
      <button class="modal-close" onclick="closeModal('historyModal')">&times;</button>
    </div>
    <div id="historyContent" class="history-panel" style="max-height:450px"></div>
  </div>

  <!-- Stats Popup Modal -->
  <div class="modal" id="statsModal" style="max-width:700px">
    <div class="modal-header">
      <h2 id="statsModalTitle">Tasks</h2>
      <button class="modal-close" onclick="closeModal('statsModal')">&times;</button>
    </div>
    <div id="statsModalContent" style="max-height:450px;overflow-y:auto"></div>
  </div>

  <!-- Archive Modal -->
  <div class="modal" id="archiveModal" style="max-width:600px">
    <div class="modal-header">
      <h2>Archived Items</h2>
      <button class="modal-close" onclick="closeModal('archiveModal')">&times;</button>
    </div>
    <div id="archiveContent" style="max-height:450px;overflow-y:auto"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
