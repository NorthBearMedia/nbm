<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>North Bear Console</title>
  <link rel="icon" type="image/png" href="/NBM%20Logo%20Black%20BG.png">
  <link rel="stylesheet" href="styles.css?v=28">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&family=Open+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <nav class="navbar">
    <div class="nav-brand">
      <img src="/NBM%20Logo%20Black%20BG.png" alt="North Bear Media" class="logo-mark" style="width:44px;height:44px;border-radius:12px;object-fit:cover">
      <div>
        <h1>North Bear Console</h1>
      </div>
    </div>
    <div class="nav-center">
      <button class="nav-tab active" data-view="clients"><span class="nav-icon">&#9783;</span> Home</button>
      <button class="nav-tab" data-view="today"><span class="nav-icon">&#9788;</span> Today</button>
      <button class="nav-tab" data-view="calendar"><span class="nav-icon">&#128197;</span> Calendar</button>
    </div>
    <div class="nav-right">
      <div class="search-container" style="position:relative">
        <input type="text" id="taskSearch" placeholder="Search tasks (e.g. NB001)..." style="background:var(--bg-glass);border:1px solid var(--border);border-radius:var(--radius);padding:8px 14px;font-size:12px;color:var(--text);width:200px;outline:none;font-family:inherit">
        <div id="searchResults" style="display:none;position:absolute;top:100%;right:0;margin-top:8px;width:450px;max-height:400px;overflow-y:auto;background:rgba(45,41,42,0.97);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-lg);z-index:999"></div>
      </div>
      <button class="nav-action" id="addClientBtn" title="New Client">+</button>
      <button class="nav-action" id="manageTeamBtn" title="Team">&#128101;</button>
      <button class="nav-action" id="manageUsersBtn" title="Users &amp; Permissions">&#9881;</button>
      <button class="nav-action" id="globalHistoryBtn" title="Activity Log" style="display:none">&#128337;</button>
      <button class="nav-action" id="viewArchiveBtn" title="Archive">&#128230;</button>
      <button class="nav-action" onclick="logout()" title="Sign Out">&#9211;</button>
    </div>
  </nav>

  <div class="sub-bar" id="clientSubBar">
    <div class="filter-group">
      <button class="filter-btn active" data-filter="all">All Clients</button>
      <button class="filter-btn" data-filter="recurring">Recurring</button>
      <button class="filter-btn" data-filter="ad-hoc">Ad Hoc</button>
      <span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span>
      <button class="filter-btn" id="myTasksBtn" onclick="toggleMyTasks()">My Tasks</button>
      <span style="width:1px;height:20px;background:var(--border);margin:0 4px"></span>
      <select id="clientSort" style="background:var(--bg-glass);border:1px solid var(--border);border-radius:var(--radius);padding:5px 10px;font-size:12px;color:var(--text);cursor:pointer;font-family:inherit">
        <option value="manual">Manual Order</option>
        <option value="alpha">A &rarr; Z</option>
        <option value="alpha-desc">Z &rarr; A</option>
        <option value="recent">Recently Changed</option>
        <option value="outstanding">Most Outstanding</option>
      </select>
    </div>
    <div class="stats-bar" id="statsBar"></div>
  </div>

  <main class="main">
    <div id="clientsView">
      <div class="table-container">
        <div class="table-header">
          <div>Client</div><div>Type</div><div style="text-align:center">Projects</div><div style="text-align:center">Outstanding</div><div>Progress</div><div></div>
        </div>
        <div id="clientList" class="client-list"><div class="empty-state"><img src="/NBM%20Logo%20No%20NG%20Light%20Lines.png" alt="" style="width:80px;opacity:0.3;margin-bottom:16px"><p>Loading...</p></div></div>
        <div id="filterNotice" style="display:none"></div>
      </div>
    </div>

    <div id="todayView" style="display:none">
      <div class="view-header">
        <h2 id="todayTitle">Today's Tasks</h2>
        <div class="view-controls">
          <select id="todayPerson"><option value="">Everyone</option></select>
          <input type="date" id="todayDate">
        </div>
      </div>
      <div id="todayContent" class="today-content"></div>
    </div>

    <div id="calendarView" style="display:none">
      <div class="view-header">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="btn btn-ghost btn-sm" onclick="calendarPrev()">&#9664;</button>
          <h2 id="calendarTitle">April 2026</h2>
          <button class="btn btn-ghost btn-sm" onclick="calendarNext()">&#9654;</button>
        </div>
        <div class="view-controls">
          <select id="calendarPerson"><option value="">Everyone</option></select>
        </div>
      </div>
      <div id="calendarGrid" class="calendar-grid"></div>
    </div>
  </main>

  <div class="modal-backdrop" id="modalBackdrop"></div>

  <!-- Client Modal -->
  <div class="modal" id="clientModal">
    <div class="modal-header"><h2 id="clientModalTitle">New Client</h2><button class="modal-close" onclick="closeModal('clientModal')">&times;</button></div>
    <form id="clientForm">
      <div class="form-error" id="clientFormError"></div>
      <input type="hidden" id="clientId">
      <div class="form-row"><div class="form-group"><label>Client Name</label><input type="text" id="clientName" required></div><div class="form-group"><label>Code (exactly 3 letters)</label><input type="text" id="clientCode" minlength="3" maxlength="3" pattern="[A-Za-z]{3}" placeholder="e.g. NBM" required style="text-transform:uppercase"></div></div>
      <div class="form-group"><label>Agreement Type</label><select id="clientType"><option value="recurring">Recurring</option><option value="ad-hoc">Ad Hoc / One-off</option></select></div>
      <div class="form-group"><label>Notes</label><textarea id="clientNotes" rows="2"></textarea></div>
      <div class="form-row"><div class="form-group"><label>Gmail Link</label><input type="url" id="clientGmail" placeholder="https://mail.google.com/..."></div><div class="form-group"><label>Google Drive Link</label><input type="url" id="clientDrive" placeholder="https://drive.google.com/..."></div></div>
      <div class="form-group"><label>Logo</label><input type="file" id="clientLogo" accept="image/*"></div>
      <div class="form-group" id="privateClientGroup" style="display:none"><label style="display:flex;align-items:center;gap:8px;cursor:pointer"><input type="checkbox" id="clientPrivate"> <span>Private Client</span> <span style="font-size:11px;color:var(--text-secondary)">(only visible to you)</span></label></div>
      <div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal('clientModal')">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div>

  <!-- Project Modal -->
  <div class="modal" id="projectModal">
    <div class="modal-header"><h2 id="projectModalTitle">New Project</h2><button class="modal-close" onclick="closeModal('projectModal')">&times;</button></div>
    <form id="projectForm">
      <div class="form-error" id="projectFormError"></div>
      <input type="hidden" id="projectId"><input type="hidden" id="projectClientId">
      <div class="form-group"><label>Project Name</label><input type="text" id="projectName" required></div>
      <div class="form-group"><label>Status</label><select id="projectStatus"><option value="active">Active</option><option value="on-hold">On Hold</option><option value="completed">Completed</option><option value="ready-to-invoice">Ready to Invoice</option><option value="invoiced">Invoiced</option></select></div>
      <div class="form-group"><label>Notes</label><textarea id="projectNotes" rows="2"></textarea></div>
      <div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal('projectModal')">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div>

  <!-- Task Modal -->
  <div class="modal modal-lg" id="taskModal">
    <div class="modal-header"><h2 id="taskModalTitle">New Task</h2><button class="modal-close" onclick="closeModal('taskModal')">&times;</button></div>
    <form id="taskForm">
      <div class="form-error" id="taskFormError"></div>
      <input type="hidden" id="taskId"><input type="hidden" id="taskProjectId">
      <div class="form-group"><label>Task Title</label><input type="text" id="taskTitle" required></div>
      <div class="form-row form-row-3">
        <div class="form-group"><label>Assigned To</label><select id="taskAssignee"><option value="">Unassigned</option></select></div>
        <div class="form-group"><label>Priority</label><select id="taskPriority"><option value="critical">&#128308; Critical</option><option value="high">&#128992; High</option><option value="medium" selected>&#128993; Medium</option><option value="low">&#128994; Low</option></select></div>
        <div class="form-group"><label>Progress</label><select id="taskProgress"><option value="not-started">Not Started</option><option value="in-progress">In Progress</option><option value="completed">Completed</option><option value="stuck">Stuck</option><option value="awaiting-client">Awaiting Client</option><option value="awaiting-manager">Awaiting Manager</option><option value="ready-to-invoice">Ready to Invoice</option><option value="invoiced">Invoiced</option></select></div>
      </div>
      <div class="form-row form-row-3">
        <div class="form-group"><label>Deadline</label><input type="date" id="taskDeadline"></div>
        <div class="form-group"><label>Planned Date</label><input type="date" id="taskPlannedDate"></div>
        <div class="form-group"><label>Est. Hours</label><input type="number" id="taskEstHours" min="0" step="0.5"></div>
      </div>
      <div class="form-group"><label>References / Links</label><input type="text" id="taskReferences"></div>
      <div class="form-group"><label>Notes</label><textarea id="taskNotes" rows="2"></textarea></div>
      <div class="form-group">
        <label><input type="checkbox" id="taskRecurring"> Recurring task</label>
        <div id="recurOptions" style="display:none;margin-top:8px">
          <div class="form-row" style="max-width:300px">
            <div class="form-group"><label>Every</label><input type="number" id="taskRecurInterval" min="1" value="1" style="width:70px"></div>
            <div class="form-group"><label>Period</label><select id="taskRecurUnit"><option value="days">Days</option><option value="weeks">Weeks</option><option value="months" selected>Months</option><option value="years">Years</option></select></div>
          </div>
        </div>
      </div>
      <div class="form-group">
        <label>Attachments</label>
        <div id="taskAttachmentsList"></div>
        <input type="file" id="taskFiles" multiple accept="image/*,video/*,.pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.zip" style="margin-top:6px">
      </div>
      <div class="form-actions"><button type="button" class="btn btn-ghost" onclick="closeModal('taskModal')">Cancel</button><button type="submit" class="btn btn-primary">Save</button></div>
    </form>
  </div>

  <!-- Team Modal -->
  <div class="modal" id="teamModal">
    <div class="modal-header"><h2>Team</h2><button class="modal-close" onclick="closeModal('teamModal')">&times;</button></div>
    <div id="teamList" class="team-list"></div>
  </div>

  <!-- Users & Permissions Modal -->
  <div class="modal modal-lg" id="usersModal">
    <div class="modal-header"><h2>Users &amp; Permissions</h2><button class="modal-close" onclick="closeModal('usersModal')">&times;</button></div>
    <div id="usersList" style="padding:28px 36px"></div>
    <div id="addUserSection" style="display:none;padding:0 36px 28px">
      <h3 style="font-size:14px;font-weight:700;color:var(--text);margin-bottom:16px;font-family:'Montserrat',sans-serif">Add New User</h3>
      <form id="addUserForm">
        <div class="form-row">
          <div class="form-group"><label>Display Name</label><input type="text" id="newUserName" required></div>
          <div class="form-group"><label>Username</label><input type="text" id="newUserUsername" required></div>
        </div>
        <div class="form-row form-row-3">
          <div class="form-group"><label>Email</label><input type="email" id="newUserEmail" required></div>
          <div class="form-group"><label>Password</label><input type="password" id="newUserPassword" required minlength="4"></div>
          <div class="form-group"><label>Role</label><select id="newUserRole"><option value="editor">Editor</option><option value="viewer">Viewer</option><option value="owner">Owner</option></select></div>
        </div>
        <div class="form-actions"><button type="button" class="btn btn-ghost" onclick="document.getElementById('addUserSection').style.display='none'">Cancel</button><button type="submit" class="btn btn-primary">Create User</button></div>
      </form>
    </div>
  </div>

  <!-- History Modal -->
  <div class="modal" id="historyModal" style="max-width:620px">
    <div class="modal-header"><h2 id="historyModalTitle">History</h2><button class="modal-close" onclick="closeModal('historyModal')">&times;</button></div>
    <div id="historyContent" class="history-panel" style="max-height:450px"></div>
  </div>

  <!-- Stats Popup -->
  <div class="modal" id="statsModal" style="max-width:750px">
    <div class="modal-header"><h2 id="statsModalTitle">Tasks</h2><button class="modal-close" onclick="closeModal('statsModal')">&times;</button></div>
    <div id="statsModalContent" style="max-height:450px;overflow-y:auto"></div>
  </div>

  <!-- Archive Modal -->
  <div class="modal" id="archiveModal" style="max-width:600px">
    <div class="modal-header"><h2>Archived Items</h2><button class="modal-close" onclick="closeModal('archiveModal')">&times;</button></div>
    <div id="archiveContent" style="max-height:450px;overflow-y:auto"></div>
  </div>

  <footer class="app-footer">
    <img src="/NBM%20Logo%20No%20NG%20Light%20Lines.png" alt="" style="width:28px;opacity:0.4">
    <span>&copy; 2026 North Bear Media. All rights reserved.</span>
    <span class="app-version">v2.7</span>
  </footer>

  <!-- Crop Modal -->
  <div id="cropModalBackdrop" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:10000;align-items:center;justify-content:center">
    <div style="background:var(--bg-card);border-radius:var(--radius-lg);padding:24px;width:90%;max-width:500px;max-height:90vh;display:flex;flex-direction:column;gap:16px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <h3 id="cropModalTitle" style="margin:0;font-family:var(--font-heading)">Crop Image</h3>
        <button onclick="closeCropModal()" style="background:none;border:none;color:var(--text);font-size:20px;cursor:pointer">&times;</button>
      </div>
      <div style="max-height:350px;overflow:hidden;background:#1a1a1a;border-radius:var(--radius)">
        <img id="cropImage" style="max-width:100%;display:block">
      </div>
      <div style="display:flex;align-items:center;gap:12px">
        <span style="font-size:12px;color:var(--text-secondary)">Zoom</span>
        <input type="range" id="cropZoom" min="0.1" max="3" step="0.05" value="1" style="flex:1" oninput="if(window._cropper)window._cropper.zoomTo(parseFloat(this.value))">
      </div>
      <div style="display:flex;gap:8px;justify-content:flex-end">
        <button class="btn btn-ghost" onclick="closeCropModal()">Cancel</button>
        <button class="btn btn-primary" onclick="applyCrop()">Apply</button>
      </div>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
  <script src="app.js?v=28"></script>
</body>
</html>
